name: Build X6100 CQ POTA fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout patched GUI
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            python3 \
            rsync \
            unzip \
            bc \
            cpio \
            file \
            wget \
            curl \
            patch

      - name: Clone X6100 Buildroot
        run: |
          git clone --recurse-submodules \
            https://github.com/gdyuldin/AetherX6100Buildroot.git \
            "$GITHUB_WORKSPACE/../AetherX6100Buildroot"

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../AetherX6100Buildroot/buildroot/dl
            ${{ github.workspace }}/../AetherX6100Buildroot/dl
          key: x6100-buildroot-dl-${{ runner.os }}-v1
          restore-keys: |
            x6100-buildroot-dl-${{ runner.os }}-

      - name: Cache Buildroot toolchain and sysroot
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../AetherX6100Buildroot/build/host
            ${{ github.workspace }}/../AetherX6100Buildroot/build/staging
          key: x6100-toolchain-${{ runner.os }}-${{ hashFiles('../AetherX6100Buildroot/.gitmodules') }}-v1
          restore-keys: |
            x6100-toolchain-${{ runner.os }}-

      - name: Configure Buildroot
        working-directory: ../AetherX6100Buildroot
        run: ./br_config.sh

      - name: Build Buildroot toolchain/rootfs
        working-directory: ../AetherX6100Buildroot/build
        run: |
          echo "Runner CPUs: $(nproc)"
          make -j"$(nproc)"

      - name: Build X6100 GUI
        working-directory: buildroot
        run: ./build.sh

      - name: Collect outputs
        shell: bash
        run: |
          mkdir -p artifact

          find . -type f \
            \( -name 'x6100_gui' -o -name '*.img' -o -name '*.img.zip' \) \
            -exec cp -v {} artifact/ \; || true

          find "$GITHUB_WORKSPACE/../AetherX6100Buildroot" -type f \
            \( -name 'sdcard*.img' -o -name 'sdcard*.img.zip' \) \
            -exec cp -v {} artifact/ \; || true

          echo "Artifacts:"
          ls -lah artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: x6100-cq-pota-build
          path: artifact/
          if-no-files-found: error
